name: Check text recognition

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download offline libraries
        run: bash scripts/fetch-vendor.sh
      - name: Install browser
        run: |
          npm init -y >/dev/null
          npm install playwright@1.47.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Serve the app
        run: (cd site && python3 -m http.server 8765 >/dev/null 2>&1 &) && sleep 2
      - name: Recognise a sample page
        run: node scripts/check-ocr.mjs http://localhost:8765/index.html
