<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Petal &amp; Page</title>
<meta name="theme-color" content="#FAF4F2">
<meta name="description" content="A reading journal for a home library, stored on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petal & Page">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: one-column reading journal (max 640px), five-tab bar along the bottom, sheets slide up.
   Colours are computed in script from the chosen palette and the time of day; these are first-paint values. */
:root{
  --bg:#FAF4F2; --surface:#FFFFFF; --raised:#F7EFEC; --ink:#3F2A33; --muted:#85707A; --accent:#B66E7B; --on-accent:#FFFFFF;
  --primary:#4A2E3B; --on-primary:#FBEFF1; --soft:#F3E0E1; --line:#ECDFDD; --gold:#C2A07A; --glow:rgba(243,224,225,.9); --scrim:rgba(40,22,30,.42);
  --covS:30%; --covL:85%; --covInk:#3F2A33;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,label,input,select,textarea{touch-action:manipulation}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;transition:background-color .9s ease,color .9s ease;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.glow{position:fixed;inset:0 0 auto;height:360px;background:radial-gradient(120% 100% at 50% 0%,var(--glow),transparent 70%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:2.3rem;line-height:1.05}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
h2{font-size:1.6rem;line-height:1.15}
h3{font-size:1.28rem;line-height:1.2}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.eyebrow svg{width:14px;height:14px;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hdr{display:flex;flex-direction:column;gap:6px}
.tnum{font-variant-numeric:tabular-nums}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55;margin:4px 0}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--primary);color:var(--on-primary);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;letter-spacing:.01em}
.btn svg{width:18px;height:18px}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--primary);text-decoration:underline;text-underline-offset:3px;min-height:40px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--primary);padding:4px 0;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:.88rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:44px;font-size:16px}
input[type=date]{-webkit-appearance:none;appearance:none}
textarea{min-height:88px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.cover{flex:none;border-radius:3px 8px 8px 3px;object-fit:cover;background:hsl(var(--h,340) var(--covS) var(--covL));color:var(--covInk);display:grid;place-items:center;font-family:var(--display);font-style:italic;box-shadow:inset 3px 0 0 rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.1)}
.cover.s{width:44px;height:64px;font-size:1.5rem}
.cover.m{width:72px;height:106px;font-size:2.2rem}
.cover.l{width:96px;height:140px;font-size:3rem}

.now{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;width:100%}
.now .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.now h3{font-size:1.4rem;line-height:1.1}
.bar{height:6px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .meta{flex:1;min-width:0}
.item .t{font-family:var(--display);font-size:1.18rem;font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.item .a{font-size:.85rem;color:var(--muted)}
.pill{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap;font-weight:500}
.pill.reading{background:var(--primary);color:var(--on-primary)}
.pill.want{background:var(--soft);color:var(--ink)}
.pill.done{box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}
.pill.ex{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.banner{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 12px 26px -12px var(--primary);padding:13px 20px}
@media (min-width:700px){.fab{right:calc(50% - 320px + 18px)}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.68rem;letter-spacing:.04em;color:var(--muted);min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--primary)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}

/* habit */
.habit{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.streak{display:flex;align-items:center;gap:14px}
.streak .num{font-family:var(--display);font-size:3.2rem;line-height:.9;font-weight:600;color:var(--accent)}
.streak .lab{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted)}
.streak .lab b{color:var(--ink);font-weight:500;font-size:1rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.week span{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}
.week span.l1{background:var(--soft);box-shadow:none}
.week span.l2{background:color-mix(in srgb,var(--accent) 45%,var(--soft));box-shadow:none}
.week span.l3{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.week span svg{width:14px;height:14px}
.week .td span{outline:1.5px solid var(--gold);outline-offset:2px}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px}
.cal .dow{font-size:.68rem;text-align:center;color:var(--muted);letter-spacing:.08em;padding:4px 0}
.day{border:0;background:none;border-radius:50%;aspect-ratio:1;max-width:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;font-size:.92rem;position:relative;color:var(--ink)}
.day.blank{pointer-events:none}
.day.l1{background:var(--soft)}
.day.l2{background:color-mix(in srgb,var(--accent) 40%,var(--soft))}
.day.l3{background:var(--accent);color:var(--on-accent)}
.day.today::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--gold)}
.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.day.future{opacity:.45}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:hsl(var(--h) 55% 55%)}
.day.l3 .dots i{background:var(--on-accent)}
.legend{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1;font-weight:600}
.stat span{font-size:.74rem;color:var(--muted)}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .sw{width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 55% 55%);flex:none}
.ev .sw.ck{background:var(--gold)}

/* stats */
.goal{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.goal svg{width:112px;height:112px;flex:none}
.goal .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;line-height:1}
.chart{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;align-items:end;height:140px;position:relative}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .b i{display:block;width:100%;max-width:26px;background:var(--soft);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b.cur i{background:var(--accent)}
.bars .b em{font-style:normal;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars-x{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;font-size:.68rem;color:var(--muted);text-align:center}
.heat{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px;width:100%}
.heat i{display:block;width:100%;height:0;padding-top:100%;border-radius:3px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.heat i.l1{background:var(--soft);box-shadow:none}
.heat i.l2{background:color-mix(in srgb,var(--accent) 45%,var(--soft));box-shadow:none}
.heat i.l3{background:var(--accent);box-shadow:none}
.heat i.x{visibility:hidden}

.quote{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
.quote blockquote{margin:0;font-family:var(--display);font-size:1.32rem;line-height:1.35;font-style:italic;overflow-wrap:anywhere}
.quote blockquote::before{content:"\201C";color:var(--gold);font-size:2.2rem;line-height:0;vertical-align:-.45em;margin-right:2px}
.quote .src{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.quote img{border-radius:10px;max-height:180px;object-fit:cover;width:100%}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.panel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:22px 22px 0 0;z-index:51;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.panel.on{transform:none}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 10px;z-index:2}
.sheet-h::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
.scan{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--accent);border-radius:16px;padding:16px;cursor:pointer;background:var(--raised);text-align:left;width:100%;color:var(--ink)}
.scan svg{width:30px;height:30px;color:var(--accent);flex:none}
.scan b{display:block;font-weight:600}
.scan-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scan-opts .scan{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint.ok{color:var(--primary);font-weight:500}
.live{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.live video{width:100%;height:100%;object-fit:cover;display:block}
.live .guide{position:absolute;left:10%;right:10%;top:32%;bottom:32%;border:2px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.live .guide::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--accent);animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-28px)}to{transform:translateY(28px)}}
.live p{position:absolute;left:0;right:0;bottom:8px;margin:0;text-align:center;color:#fff;font-size:.82rem;text-shadow:0 1px 3px #000}
.d-top{display:flex;gap:16px;align-items:flex-end}
.d-top .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.d-top h2{overflow-wrap:anywhere}
.bm{background:var(--raised);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.bm .big{font-family:var(--display);font-size:2.6rem;line-height:1;font-weight:600}
.bm .big small{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:400;margin-left:4px}
.lg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.lg:last-child{border-bottom:0}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;width:36px;height:36px;border-radius:50%;flex:none}
.note{background:var(--raised);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.words{display:flex;flex-wrap:wrap;gap:4px 3px;background:var(--raised);border-radius:12px;padding:12px;max-height:260px;overflow:auto;font-family:var(--display);font-size:1.15rem;line-height:1.5}
.words button{border:0;background:none;padding:0 2px;border-radius:4px;font:inherit}
.words button.hl{background:var(--soft);box-shadow:0 2px 0 var(--accent)}
.qimg{border-radius:12px;max-height:240px;object-fit:contain;width:100%;background:var(--raised)}
.toast{position:fixed;left:50%;bottom:calc(144px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw-btn{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.sw-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw-btn .strip{display:flex;height:26px;border-radius:8px;overflow:hidden}
.sw-btn .strip i{flex:1}
pre.bk{white-space:pre-wrap;word-break:break-all;font-size:.72rem;max-height:160px;overflow:auto;background:var(--raised);border-radius:10px;padding:10px;margin:0}
.update{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.update.on{transform:none}
.update .in{pointer-events:auto;max-width:560px;width:100%;background:var(--primary);color:var(--on-primary);border-radius:18px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 32px -14px rgba(0,0,0,.45)}
.update .in div{flex:1;min-width:0;font-size:.9rem;line-height:1.35}
.update .in b{display:block;font-weight:600}
.update button{border:0;border-radius:999px;padding:9px 14px;font-weight:500;min-height:40px}
.update .go{background:var(--on-primary);color:var(--primary)}
.update .later{background:transparent;color:var(--on-primary);opacity:.8}
.whatsnew li{margin:4px 0}
.ver{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main id="app"></main>
<nav class="tabs" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<div class="scrim" id="scrim" hidden></div>
<section class="panel" id="panel" hidden role="dialog" aria-modal="true"></section>
<div class="toast" id="toast" role="status"></div>
<div class="update" id="update" role="alert" aria-live="assertive"><div class="in"><div><b>A new version is ready</b>Update now to get the latest improvements. Your books stay safe.</div><button class="later" data-act="uplater">Later</button><button class="go" data-act="upnow">Update</button></div></div>

<script>
(function(){
/* ---------- version ---------- */
const APP_VERSION='1.3.0';

function normalize(s){

  s.settings=Object.assign({phase:'auto',palette:'rosegold',goal:{type:'minutes',value:20},yearGoal:12},s.settings||{});
  if(!s.settings.goal||!s.settings.goal.type)s.settings.goal={type:'minutes',value:20};
  if(s.settings.paletteV!==2){s.settings.palette='rosegold';s.settings.paletteV=2}
  s.checkins=s.checkins||{};s.exCheckins=s.exCheckins||{};
  s.books.forEach(b=>{b.sessions=b.sessions||[];b.notes=b.notes||[];b.quotes=b.quotes||[];b.hue=b.hue??340;b.page=b.page||0});

}

function seed(){const x=sampleLibrary();return{books:x.books,exCheckins:x.checkins}}
function sampleLibrary(){
  // Deterministic sample: classics read through the current year, with sessions, notes, quotes and check-ins.

  const ri=(lo,hi)=>lo+Math.floor(rnd()*(hi-lo+1));
  const yr=new Date().getFullYear(),td=today(),limit=addDays(td,-22);
  const NOTES=['Couldn’t put it down after the halfway point.','Slow start, but the ending made it worth it.','Lovely writing. Want to reread this one someday.','Recommended by Mum. She was right.','Read most of this in the garden on Sunday.','The letters chapter made me cry.','Book club pick for this month.','Annotated a lot of pages in this one.','The heroine is wonderful. Such a sharp voice.','Bought a second-hand copy with someone’s old notes in it.'];
  const F=[
    ['Pride and Prejudice','Jane Austen',432,8,['It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.','I declare after all there is no enjoyment like reading!']],
    ['Jane Eyre','Charlotte Brontë',532,352,['I am no bird; and no net ensnares me: I am a free human being with an independent will.']],
    ['Persuasion','Jane Austen',249,340,['You pierce my soul. I am half agony, half hope.']],
    ['The Great Gatsby','F. Scott Fitzgerald',180,20,['So we beat on, boats against the current, borne back ceaselessly into the past.']],
    ['Anne of Green Gables','L. M. Montgomery',320,332,['Isn’t it nice to think that tomorrow is a new day with no mistakes in it yet?']],
    ['Wuthering Heights','Emily Brontë',416,300,['Whatever our souls are made of, his and mine are the same.']],
    ['Little Women','Louisa May Alcott',459,346,['I’m not afraid of storms, for I’m learning how to sail my ship.']],
    ['A Room with a View','E. M. Forster',240,10,[]],
    ['The Age of Innocence','Edith Wharton',352,322,[]],
    ['Emma','Jane Austen',474,338,['One half of the world cannot understand the pleasures of the other.']],
    ['Sense and Sensibility','Jane Austen',409,355,[]],
    ['Mansfield Park','Jane Austen',507,342,[]],
    ['The House of Mirth','Edith Wharton',329,318,[]],
    ['Villette','Charlotte Brontë',573,6,[]]
  ];
  const ck={},books=[];let cur=yr+'-01-03';
  const readDays=(b,start,target,stopAt,force,maxPer)=>{
    let d=start,page=b.page||0;
    while(page<target&&d<=stopAt){
      const recent=d>=addDays(td,-10);
      if(force||recent||rnd()<.7){const p=Math.min(target-page,ri(9,maxPer||46));page+=p;b.sessions.push({id:uid(),date:d,page,min:Math.max(5,Math.round(p*(1.2+rnd()*.9)))})}
      else if(rnd()<.25)ck[d]=ri(1,3)*10;
      d=addDays(d,1);
    }
    b.page=page;return addDays(d,-1);
  };
  for(const [title,author,pages,hue,qs] of F){
    if(cur>limit)break;
    const b={id:uid(),example:true,title,author,isbn:'',pages,status:'done',start:cur,finish:'',page:0,hue,cover:null,sessions:[],notes:[],quotes:[]};
    const fin=readDays(b,cur,pages,limit,false);
    if(b.page<pages){b.notes.push({id:uid(),date:addDays(limit,-3),text:'Set this aside for a while. Will come back to it.'});books.push(b);b.status='reading';break}
    b.finish=fin;
    const n=ri(1,2);for(let i=0;i<n;i++)b.notes.push({id:uid(),date:addDays(b.start,ri(0,Math.max(0,Math.round((pd(fin)-pd(b.start))/864e5)))),text:NOTES[ri(0,NOTES.length-1)]});
    qs.forEach(q=>b.quotes.push({id:uid(),date:addDays(b.start,ri(1,8)),page:ri(5,pages-5),text:q,img:null}));
    books.push(b);cur=addDays(fin,ri(1,4));
  }
  // in progress
  const sg={id:uid(),example:true,title:'The Secret Garden',author:'Frances Hodgson Burnett',isbn:'',pages:331,status:'reading',start:addDays(td,-14),finish:'',page:0,hue:345,cover:null,sessions:[],notes:[{id:uid(),date:addDays(td,-6),text:'Mary is softening. The robin chapters are lovely.'}],quotes:[{id:uid(),date:addDays(td,-4),page:112,text:'If you look the right way, you can see that the whole world is a garden.',img:null}]};
  readDays(sg,sg.start,240,addDays(td,-1),false,30);books.push(sg);
  const ns={id:uid(),example:true,title:'North and South',author:'Elizabeth Gaskell',isbn:'',pages:521,status:'reading',start:addDays(limit,1),finish:'',page:0,hue:5,cover:null,sessions:[],notes:[{id:uid(),date:addDays(td,-30),text:'Reading this one slowly, a chapter at a time.'}],quotes:[]};
  readDays(ns,addDays(limit,1),380,addDays(td,-15),true,24);ns.start=ns.sessions.length?ns.sessions[0].date:ns.start;books.push(ns);
  // wishlist
  [['Middlemarch','George Eliot',880,322],['The Enchanted April','Elizabeth von Arnim',247,336],['Mrs Dalloway','Virginia Woolf',194,312],['Cranford','Elizabeth Gaskell',230,350]].forEach(([title,author,pages,hue])=>books.push({id:uid(),example:true,title,author,isbn:'',pages,status:'want',start:'',finish:'',page:0,hue,cover:null,sessions:[],notes:[],quotes:[]}));
  // keep the recent streak unbroken
  for(let i=1;i<=9;i++){const d=addDays(td,-i);if(!books.some(b=>b.sessions.some(x=>x.date===d)))ck[d]=ri(1,3)*10}
  books.forEach(b=>{if(b.sessions.length)b.page=b.sessions[b.sessions.length-1].page});
  return{books,checkins:ck};
}

const hx=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const mix=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};

function autoPhase(){const h=new Date().getHours();return h>=5&&h<11?'dawn':h>=11&&h<17?'day':h>=17&&h<20?'golden':'night'}

function tokens(pk,ph){
  const P=PALETTES[pk]||PALETTES.rosegold;
  if(ph==='night'){const d=P.dark;return Object.assign({},d,{glow:rgba(d.accent,.13),scrim:'rgba(6,2,4,.62)',covS:'20%',covL:'29%',covInk:d.ink,scheme:'dark'})}

  const tint={dawn:['#FFE3D3',.2,.1],golden:['#F7CFB6',.3,.16]}[ph];
  if(tint){for(const k of ['bg','raised'])l[k]=mix(l[k],tint[0],tint[1]);for(const k of ['surface','soft','line'])l[k]=mix(l[k],tint[0],tint[2])}

}
let curTheme='';
function applyTheme(force){
  const ph=phase(),pk=(S&&S.settings.palette)||'rosegold',key=pk+ph;
  if(key===curTheme&&!force)return;curTheme=key;

function compress(src,max,q){return new Promise((res,rej)=>{const img=new Image();const url=typeof src==='string'?src:URL.createObjectURL(src);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(typeof src!=='string')URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('image'));img.src=url})}

let nativeDet=null,zx=null;
async function getNative(){
  if(nativeDet!==null)return nativeDet;nativeDet=false;
  if('BarcodeDetector' in window){try{let fm=['ean_13','ean_8','upc_a','upc_e','qr_code','code_128'];const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(x=>sup.includes(x));if(fm.length)nativeDet=new BarcodeDetector({formats:fm})}catch(e){nativeDet=false}}
  return nativeDet;
}
async function getZX(){
  if(zx)return zx;
  if(!window.ZXing)await loadScript('vendor/zxing.min.js');
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.CODE_128]);
  h.set(Z.DecodeHintType.TRY_HARDER,true);
  const r=new Z.MultiFormatReader();r.setHints(h);zx={Z,r};return zx;
}
function lumSource(Z,c){
  if(Z.HTMLCanvasElementLuminanceSource)return new Z.HTMLCanvasElementLuminanceSource(c);
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,g=new Uint8ClampedArray(c.width*c.height);
  for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=(d[i]*306+d[i+1]*601+d[i+2]*117)>>10;
  return new Z.RGBLuminanceSource(g,c.width,c.height);
}
function zxCanvas(c){try{const {Z,r}=zx;const src=lumSource(Z,c);const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(src));const res=r.decodeWithState(bmp);r.reset();return res.getText()}catch(e){try{zx.r.reset()}catch(_){}return null}}
function drawTo(src,sw,sh,crop,w,rot){
  // crop = [x,y,w,h] in source pixels; output width w; rot 0|90
  const c=document.createElement('canvas'),k=w/crop[2];
  const ow=Math.round(crop[2]*k),oh=Math.round(crop[3]*k);
  c.width=rot?oh:ow;c.height=rot?ow:oh;const g=c.getContext('2d',{willReadFrequently:true});
  if(rot){g.translate(c.width/2,c.height/2);g.rotate(Math.PI/2);g.drawImage(src,crop[0],crop[1],crop[2],crop[3],-ow/2,-oh/2,ow,oh)}
  else g.drawImage(src,crop[0],crop[1],crop[2],crop[3],0,0,ow,oh);
  return c;
}

    await getZX();
    const full=[0,0,W,H],mid=[W*.1,H*.25,W*.8,H*.5],midTall=[W*.25,H*.1,W*.5,H*.8];
    const tries=[[full,1000,0],[mid,1000,0],[full,1600,0],[full,1000,1],[midTall,1000,1],[mid,700,0],[full,700,0]];
    for(const [crop,w,rot] of tries){const t=zxCanvas(drawTo(img,W,H,crop,w,rot));if(t)return t}

  }finally{URL.revokeObjectURL(url)}
}
let live=null;
const canLive=()=>!framed&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
async function startLive(){
  if(live)return;
  const box=$('#liveBox'),v=$('#liveV'),m=$('#scanMsg');box.hidden=false;$('#scanOpts').hidden=true;
  m.className='hint';m.textContent='Starting the camera…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    live={stream,stop:false,n:0};v.srcObject=stream;v.setAttribute('playsinline','');v.muted=true;await v.play();
    m.textContent='Hold the barcode inside the frame, about a hand’s length away.';
    const nd=await getNative();if(!nd)await getZX();
    const tick=async()=>{
      if(!live||live.stop)return;
      const W=v.videoWidth,H=v.videoHeight;let code=null;
      if(W&&H){
        if(nd){try{const r=await nd.detect(v);if(r&&r.length)code=r[0].rawValue}catch(e){}}
        else{const crop=[W*.08,H*.28,W*.84,H*.44];live.n++;code=zxCanvas(drawTo(v,W,H,crop,live.n%2?900:640,0));if(!code&&live.n%5===0)code=zxCanvas(drawTo(v,W,H,[0,0,W,H],800,0))}
      }

      setTimeout(tick,nd?150:90);
    };tick();
  }catch(err){stopLive();m.className='hint';m.textContent=err&&err.name==='NotAllowedError'?'Camera access was blocked. Allow the camera for this site in your phone’s settings, or use Take a photo.':'The camera couldn’t start. Use Take a photo instead.'}

/* ---------- ISBN ---------- */
function toIsbn13(x){
  x=x.replace(/[^0-9Xx]/g,'').toUpperCase();
  if(/^97[89]\d{10}$/.test(x))return x;
  if(/^\d{9}[\dX]$/.test(x)){const b='978'+x.slice(0,9);let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return b+((10-s%10)%10)}
  return null;
}
async function fetchJSON(url,ms){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms||8000);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function coverData(url){
  if(!url)return null;
  try{const ac=new AbortController();setTimeout(()=>ac.abort(),8000);const r=await fetch(url,{signal:ac.signal});if(!r.ok)return null;const b=await r.blob();if(b.size<1200)return null;return await compress(b,360,.78)}catch(e){return null}
}
async function lookupIsbn(isbn){
  if(!navigator.onLine)throw new Error('offline');
  let found=null,errs=0;
  try{const j=await fetchJSON('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
    if(v)found={title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).join(', '),pages:v.pageCount||'',cover:v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)?(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail).replace('http:','https:').replace('&edge=curl',''):null}}catch(e){errs++}
  if(!found||!found.pages||!found.author){
    try{const j=await fetchJSON('https://openlibrary.org/api/books?bibkeys=ISBN:'+isbn+'&format=json&jscmd=data');const d=j['ISBN:'+isbn];
      if(d){const ol={title:d.title+(d.subtitle?': '+d.subtitle:''),author:(d.authors||[]).map(a=>a.name).join(', '),pages:d.number_of_pages||'',cover:d.cover&&(d.cover.medium||d.cover.small)||null};
        found=found?{title:found.title||ol.title,author:found.author||ol.author,pages:found.pages||ol.pages,cover:found.cover||ol.cover}:ol}}catch(e){errs++}
  }
  if(!found&&errs===2)throw new Error('network');
  if(found&&!found.cover)found.cover='https://covers.openlibrary.org/b/isbn/'+isbn+'-M.jpg?default=false';
  return found;
}
async function fillFromIsbn(isbn){
  const m=$('#scanMsg');m.className='hint';m.textContent='Looking up ISBN '+isbn+'…';
  try{
    const r=await lookupIsbn(isbn);
    if(!r){m.textContent='No book found for ISBN '+isbn+'. It’s saved; type the title below.';return}
    if(r.title)$('#fTitle').value=r.title;if(r.author)$('#fAuthor').value=r.author;if(r.pages)$('#fPages').value=r.pages;
    m.className='hint ok';m.textContent='Found it. Check the details, then add to your shelf.';
    if(r.cover&&!window._cover){const c=await coverData(r.cover);if(c&&$('#covPrev')){window._cover=c;$('#covPrev').innerHTML=`<img class="cover s" src="${c}" alt="">`}}
  }catch(e){m.className='hint';m.textContent=e.message==='offline'?'You’re offline. The ISBN is saved; type the title below, or tap Look up later.':'Couldn’t reach the book catalogues. Check the connection and tap Look up again.'}
}
async function handleCode(code){
  const m=$('#scanMsg');if(!m)return;
  const isbn=toIsbn13(code);
  if(isbn){$('#fIsbn').value=isbn;await fillFromIsbn(isbn)}
  else if(/^\d{12}$/.test(code)){$('#fIsbn').value=code;m.className='hint';m.textContent='That’s a store barcode (UPC), not the ISBN. Look for the barcode starting 978 or 979, often on the back cover or inside.'}
  else{if(!$('#fTitle').value)$('#fTitle').value=code.slice(0,200);m.className='hint ok';m.textContent='Scanned a code. Its text was added as the title; edit as needed.'}
}

/* ---------- text recognition ---------- */
let ocrWorker=null;
async function getWorker(){
  if(ocrWorker)return ocrWorker;
  if(!window.Tesseract)await loadScript('vendor/tesseract/tesseract.min.js');
  ocrWorker=await Tesseract.createWorker('eng',1,{workerPath:'vendor/tesseract/worker.min.js',corePath:'vendor/core',langPath:'vendor/lang',workerBlobURL:false});
  return ocrWorker;
}
async function prepareReader(){const w=await getWorker();try{localStorage.setItem('pp-ocr-ready','1')}catch(e){}return w}
function readerReady(){try{return localStorage.getItem('pp-ocr-ready')==='1'}catch(e){return false}}
async function recognize(dataUrl){
  const job=prepareReader().then(w=>w.recognize(dataUrl));
  const r=await Promise.race([job,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),90000))]);
  return r.data.text||'';
}

/* ---------- reading data ---------- */
function dayStats(){
  const m={},g=d=>m[d]||(m[d]={pages:0,min:0,books:new Set(),ev:[],check:false});
  S.books.forEach(b=>{
    let prev=0;[...b.sessions].sort((a,c)=>a.date.localeCompare(c.date)||a.page-c.page).forEach(s=>{
      const delta=Math.max(0,s.page-prev);prev=Math.max(prev,s.page);const x=g(s.date);
      x.pages+=delta;x.min+=(+s.min||0);x.books.add(b.id);x.ev.push({t:'read',b,page:s.page,delta,min:+s.min||0})});
    if(b.start)g(b.start).ev.push({t:'start',b});if(b.finish)g(b.finish).ev.push({t:'finish',b});
  });
  Object.entries(Object.assign({},S.exCheckins,S.checkins)).forEach(([d,min])=>{const x=g(d);x.min+=(+min||0);x.check=true;x.ckMin=+min||0});
  Object.values(m).forEach(x=>x.read=x.books.size>0||x.check);
  return m;
}
function level(x){
  if(!x||!x.read)return 0;const G=S.settings.goal;const v=G.type==='pages'?x.pages:x.min;
  if(!G.value)return 3;const r=v/G.value;return r>=1?3:r>=.5?2:1;
}
function streaks(M){
  const days=Object.keys(M).filter(k=>M[k].read).sort();const set=new Set(days);
  let cur=0,d=today();if(!set.has(d))d=addDays(d,-1);while(set.has(d)){cur++;d=addDays(d,-1)}
  let best=0,run=0,last=null;days.forEach(k=>{run=last&&addDays(last,1)===k?run+1:1;best=Math.max(best,run);last=k});
  return{cur,best,readToday:set.has(today())};
}

/* ---------- sheets ---------- */
let sheetFor=null;
function openSheet(html,key){
  const p=$('#panel'),sc=$('#scrim');const keep=sheetFor===key?p.scrollTop:0;sheetFor=key;
  p.innerHTML=html;p.hidden=false;sc.hidden=false;
  requestAnimationFrame(()=>{p.classList.add('on');sc.classList.add('on')});p.scrollTop=keep;
}
function closeSheet(){stopLive();const p=$('#panel'),sc=$('#scrim');p.classList.remove('on');sc.classList.remove('on');sheetFor=null;setTimeout(()=>{if(!sheetFor){p.hidden=true;sc.hidden=true;p.innerHTML=''}},300);render()}

/* ---------- actions ---------- */
function setStatus(b,v){
  b.status=v;
  if(v==='reading'&&!b.start)b.start=today();
  if(v==='done'){if(!b.finish)b.finish=today();if(b.pages&&(b.page||0)<b.pages){b.page=b.pages;b.sessions.push({id:uid(),date:b.finish,page:b.pages})}if(!b.start)b.start=b.finish}
  if(v!=='done')b.finish='';
}
function backupText(){return JSON.stringify({app:'petal-page',version:2,saved:new Date().toISOString(),...S})}
async function doRestore(text){
  let d;try{d=JSON.parse(text)}catch(e){toast('That isn’t a valid backup. Check you copied all of it.');return false}
  if(!d||!Array.isArray(d.books)){toast('No books found in that backup.');return false}
  S=normalize({books:d.books,settings:d.settings,checkins:d.checkins,exCheckins:d.exCheckins});await save();applyTheme(true);render();toast('Restored '+S.books.length+' books');return true;
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id,b=id?find(id):null;
  switch(a){
    case'tab':view=t.dataset.v;render();window.scrollTo(0,0);break;
    case'filter':filter=t.dataset.v;document.querySelectorAll('[data-act=filter]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===filter));renderList();break;
    case'add':openAdd();break;
    case'upnow':applyUpdate();break;
    case'uplater':$('#update').classList.remove('on');break;
    case'whatsnew':showWhatsNew(false);break;
    case'checkupd':{if(!swReg){toast('Updates are checked when the app is installed from its website');break}t.disabled=true;t.textContent='Checking…';try{await swReg.update()}catch(e){}setTimeout(()=>{if(swReg.waiting||(swReg.installing))showUpdate();else toast('You have the latest version ('+APP_VERSION+')');render()},1500);break}
    case'live':startLive();break;
    case'stoplive':stopLive();$('#scanMsg').textContent='';break;
    case'open':openDetail(id,!!t.dataset.focus);break;
    case'close':closeSheet();break;
    case'back':openDetail(id);break;
    case'edit':openAdd(id);break;
    case'clearex':S.books=S.books.filter(x=>!x.example);S.exCheckins={};await save();render();toast('Examples removed');break;
    case'loadex':{const x=sampleLibrary();S.books=S.books.filter(b=>!b.example).concat(x.books);S.exCheckins=x.checkins;await save();view='library';render();window.scrollTo(0,0);toast('Sample library added ('+x.books.length+' books)');break}
    case'calprev':calMonth.setMonth(calMonth.getMonth()-1);render();break;
    case'calnext':calMonth.setMonth(calMonth.getMonth()+1);render();break;
    case'day':selDay=t.dataset.v;render();break;
    case'checkin':{const d=t.dataset.d;if(d>today())break;S.checkins[d]=+t.dataset.v;await save();render();toast(d===today()?'Marked today as read':'Marked '+fmt(d)+' as read');break}
    case'uncheck':delete S.checkins[t.dataset.v];delete S.exCheckins[t.dataset.v];await save();render();break;
    case'phase':S.settings.phase=t.dataset.v;await save();applyTheme();render();break;
    case'palette':S.settings.palette=t.dataset.v;await save();applyTheme();render();break;
    case'goaltype':{const G=S.settings.goal;if(G.type!==t.dataset.v){G.type=t.dataset.v;G.value=G.type==='pages'?20:20}await save();render();break}
    case'dgoal':{const G=S.settings.goal;G.value=Math.max(5,Math.min(300,(G.value||0)+(+t.dataset.v)));await save();render();break}
    case'ygoal':S.settings.yearGoal=Math.max(1,Math.min(365,(S.settings.yearGoal||12)+(+t.dataset.v)));await save();render();break;
    case'prepocr':{t.disabled=true;t.textContent='Preparing…';try{await prepareReader();toast('Text reader is ready for offline use')}catch(err){toast('Couldn’t prepare it. Connect to the internet and try again.')}render();break}
    case'status':setStatus(b,t.dataset.v);await save();openDetail(id);break;
    case'savepage':{
      const v=parseInt($('#pgIn').value,10);if(isNaN(v)||v<0){toast('Enter the page number you stopped at');$('#pgIn').focus();break}
      const d=$('#pgDate').value||today(),min=parseInt($('#pgMin').value,10)||0;
      b.page=v;b.sessions.push({id:uid(),date:d,page:v,min});
      if(b.status==='want'){b.status='reading';b.start=b.start||d}
      if(b.pages&&v>=b.pages&&b.status!=='done'){b.status='done';b.finish=d;toast('Finished! Lovely.')}else toast('Bookmark saved at page '+v);
      await save();openDetail(id);break}
    case'delsess':{b.sessions=b.sessions.filter(s=>s.id!==t.dataset.s);const last=[...b.sessions].sort((x,y)=>y.date.localeCompare(x.date))[0];b.page=last?last.page:0;await save();openDetail(id);break}
    case'addnote':{const v=$('#noteIn').value.trim();if(!v){toast('Write a note first');break}b.notes.push({id:uid(),date:today(),text:v});await save();openDetail(id);toast('Note added');break}
    case'delnote':b.notes=b.notes.filter(n=>n.id!==t.dataset.n);await save();openDetail(id);break;
    case'delquote':b.quotes=b.quotes.filter(q=>q.id!==t.dataset.q);await save();openDetail(id);break;
    case'copyq':{const q=b.quotes.find(x=>x.id===t.dataset.q);const s=`“${q.text}” — ${b.title}${b.author?', '+b.author:''}${q.page?' (p. '+q.page+')':''}`;try{await navigator.clipboard.writeText(s);toast('Quote copied')}catch(err){toast('Copy isn’t available here. Press and hold the quote to select it.')}break}
    case'delbook':if(t.dataset.armed){S.books=S.books.filter(x=>x.id!==id);await save();closeSheet();toast('Book deleted')}else{t.dataset.armed=1;t.textContent='Tap again to delete for good'}break;
    case'addquote':openQuote(id);break;
    case'w':{const i=+t.dataset.i;if(Q.a==null||Q.b!=null){Q.a=i;Q.b=null}else Q.b=i;renderWords();break}
    case'ocr':{
      const m=$('#ocrMsg');t.disabled=true;m.className='hint';m.textContent='Reading the page… this can take up to a minute.';
      try{const txt=await recognize(Q.img);Q.words=txt.split(/\s+/).filter(Boolean);Q.a=Q.b=null;
        if(!Q.words.length){m.textContent='No words found. Try a sharper, well-lit photo taken straight on.'}
        else{$('#words').hidden=false;renderWords();m.className='hint ok';m.textContent='Tap the first word of the passage, then the last.'}}
      catch(err){m.textContent='The text reader isn’t set up yet. Open the app once with internet (or tap Prepare in Settings). Meanwhile you can type the quote, or paste it from Live Text or Google Lens.'}
      t.disabled=false;break}
    case'saveq':{
      const txt=$('#qText').value.trim();if(!txt){toast('Add the quote text first');break}
      const img=Q.img&&$('#qKeep').checked?await compress(Q.img,900,.7):null;
      b.quotes.push({id:uid(),date:today(),page:parseInt($('#qPage').value,10)||'',text:txt,img});await save();openDetail(id);toast('Quote saved');break}
    case'lookup':{
      const raw=$('#fIsbn').value;const isbn=toIsbn13(raw);const m=$('#scanMsg');
      if(!isbn){m.className='hint';m.textContent='Enter the 10 or 13 digit ISBN (it starts with 978 or 979).';break}
      $('#fIsbn').value=isbn;await fillFromIsbn(isbn);break}
    case'savebook':{
      const title=$('#fTitle').value.trim();if(!title){toast('Add a title');$('#fTitle').focus();break}
      stopLive();
      const data={title,author:$('#fAuthor').value.trim(),isbn:$('#fIsbn').value.trim(),pages:parseInt($('#fPages').value,10)||0,cover:window._cover||null};
      const st=$('#fStatus').value;let bk;
      if(id){bk=find(id);Object.assign(bk,data);delete bk.example;if(bk.status!==st)setStatus(bk,st)}
      else{bk={id:uid(),...data,status:'want',start:'',finish:'',page:0,hue:HUES[Math.floor(Math.random()*HUES.length)],sessions:[],notes:[],quotes:[]};setStatus(bk,st);S.books.push(bk)}
      await save();openDetail(bk.id);toast(id?'Saved':'Added to your shelf');break}
    case'export':{try{const blob=new Blob([backupText()],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='petal-and-page-backup-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Backup saved')}catch(err){toast('Couldn’t save a file here. Use Copy backup text.')}break}
    case'copybackup':{const s=backupText();try{await navigator.clipboard.writeText(s);toast('Backup copied. Paste it into a note or email to yourself.')}catch(err){const o=$('#bkout');o.hidden=false;o.textContent=s;const r=document.createRange();r.selectNodeContents(o);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('Selected. Use your phone’s Copy.')}break}
    case'restore':{const v=$('#restoreText').value.trim();if(!v){toast('Paste backup text first');break}
      if(!t.dataset.armed){t.dataset.armed=1;t.textContent='Tap again to replace this library';break}
      if(await doRestore(v))$('#restoreText').value='';break}
  }
});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('input',e=>{
  if(e.target.id==='search'){query=e.target.value;renderList()}
  if(e.target.id==='qsearch'){qquery=e.target.value;renderQuoteList()}
});
document.addEventListener('change',async e=>{
  const el=e.target;
  if(el.dataset.field){const b=find(el.dataset.id);b[el.dataset.field]=el.value;await save();toast('Date saved');return}
  const f=el.files&&el.files[0];if(!f)return;
  if(el.id==='scanIn'){
    const m=$('#scanMsg');m.className='hint';m.textContent='Reading the barcode…';
    try{const code=await decodePhoto(f);if(!code)m.textContent='Couldn’t read a barcode in that photo. Fill most of the photo with the barcode, keep it sharp and flat, or type the ISBN.';else await handleCode(code)}
    catch(err){m.textContent='That photo couldn’t be read. Try another, or type the ISBN.'}
    el.value='';
  }
  if(el.id==='covIn'){try{window._cover=await compress(f,360,.78);$('#covPrev').innerHTML=`<img class="cover s" src="${window._cover}" alt="">`}catch(err){toast('That photo couldn’t be opened')}}
  if(el.id==='qPhoto'){try{Q.img=await compress(f,1800,.85);const im=$('#qImg');im.src=Q.img;im.hidden=false;$('#ocrBtn').disabled=false;$('#words').hidden=true;$('#ocrMsg').textContent=''}catch(err){toast('That photo couldn’t be opened')}}
  if(el.id==='restoreFile'){const txt=await f.text();await doRestore(txt);el.value=''}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetFor)closeSheet()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopLive();else{applyTheme();}});

/* ---------- updates ---------- */
let swReg=null,updating=false;
function showUpdate(){$('#update').classList.add('on')}
function applyUpdate(){
  $('#update').classList.remove('on');
  if(swReg&&swReg.waiting){updating=true;swReg.waiting.postMessage({type:'SKIP_WAITING'});setTimeout(()=>location.reload(),3000)}
  else location.reload();
}
async function setupSW(){
  if(!('serviceWorker' in navigator)||framed||!(location.protocol==='https:'||location.hostname==='localhost'))return;
  try{swReg=await navigator.serviceWorker.register('sw.js')}catch(e){return}
  const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})};
  if(swReg.waiting&&navigator.serviceWorker.controller)showUpdate();
  watch(swReg.installing);
  swReg.addEventListener('updatefound',()=>watch(swReg.installing));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating)location.reload()});
  const check=()=>{if(navigator.onLine)swReg.update().catch(()=>{})};
  setInterval(check,30*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  window.addEventListener('online',check);
}
function showWhatsNew(justUpdated){
  openSheet(`<div class="sheet-h"><h2>${justUpdated?'Updated to '+APP_VERSION:'What’s new'}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="stack">${CHANGELOG.map((c,i)=>`<div><div class="eyebrow">Version ${c.v}${i===0?' · current':''}</div><ul class="whatsnew" style="margin:6px 0 0;padding-left:20px">${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}
  <button class="btn wide" data-act="close">Lovely</button></div>`,'whatsnew');
}

/* ---------- boot ---------- */
(async()=>{
  await load();applyTheme(true);render();
  setInterval(()=>{const k=curTheme;applyTheme();if(k!==curTheme&&!sheetFor)render()},60*1000);
  setupSW();
  try{const seen=localStorage.getItem('pp-version');if(seen&&seen!==APP_VERSION)setTimeout(()=>showWhatsNew(true),600);localStorage.setItem('pp-version',APP_VERSION)}catch(e){}
  if(!framed&&navigator.onLine&&!readerReady()){setTimeout(()=>{prepareReader().then(w=>{w.terminate();ocrWorker=null;if(view==='settings')render()}).catch(()=>{})},5000)}
})();
})();
</script>
