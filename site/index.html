<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Petal &amp; Page</title>
<meta name="theme-color" content="#FAF4F2">
<meta name="description" content="A reading journal for a home library, stored on your phone.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petal & Page">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" id="fontlink" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap">
<link rel="stylesheet" id="fontpreview" disabled>
<style>
/* Layout: one-column reading journal (max 640px), five-tab bar along the bottom, sheets slide up.
   Colours are computed in script from the chosen palette and the time of day; these are first-paint values. */
:root{
  --bg:#FAF4F2; --surface:#FFFFFF; --raised:#F7EFEC; --ink:#3F2A33; --muted:#85707A; --accent:#B66E7B; --on-accent:#FFFFFF;
  --primary:#4A2E3B; --on-primary:#FBEFF1; --soft:#F3E0E1; --line:#ECDFDD; --gold:#C2A07A; --glow:rgba(243,224,225,.9); --scrim:rgba(40,22,30,.42);
  --covS:30%; --covL:85%; --covInk:#3F2A33;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif; --dw:600; --dwi:500; --ds:1;
  --rc:18px; --ri:12px; --rp:999px; --cb:1px solid var(--line); --cs:none; --cardbg:var(--surface); --fs:16px; --glassline:rgba(255,255,255,.6);
  --body:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
html{font-size:var(--fs);touch-action:manipulation;-webkit-text-size-adjust:100%}
button,a,label,input,select,textarea{touch-action:manipulation}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:.9375rem;line-height:1.5;transition:background-color .9s ease,color .9s ease;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.glow{position:fixed;inset:0 0 auto;height:360px;background:radial-gradient(120% 100% at 50% 0%,var(--glow),transparent 70%);pointer-events:none;z-index:0}
#app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(120px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:var(--dw);margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:calc(2.3rem*var(--ds));line-height:1.08}
h1 em{font-style:italic;font-weight:var(--dwi);color:var(--accent)}
h2{font-size:calc(1.6rem*var(--ds));line-height:1.15}
h3{font-size:calc(1.28rem*var(--ds));line-height:1.2}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.eyebrow svg{width:14px;height:14px;color:var(--gold)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.section{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hdr{display:flex;flex-direction:column;gap:6px}
.tnum{font-variant-numeric:tabular-nums}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.55;margin:4px 0}

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:var(--rp);padding:11px 18px;background:var(--primary);color:var(--on-primary);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;letter-spacing:.01em}
.btn svg{width:18px;height:18px}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.danger{background:transparent;color:var(--primary);text-decoration:underline;text-underline-offset:3px;min-height:40px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;color:var(--primary);padding:4px 0;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--rp);padding:7px 14px;font-size:.88rem;min-height:38px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:.78rem;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=search],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:var(--ri);padding:11px 13px;min-height:44px;font-size:16px}
input[type=date]{-webkit-appearance:none;appearance:none}
textarea{min-height:88px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.cover{flex:none;border-radius:3px 8px 8px 3px;object-fit:cover;background:hsl(calc(var(--th,340) + var(--h,340) - 340) var(--covS) var(--covL));color:var(--covInk);display:grid;place-items:center;font-family:var(--display);font-style:italic;box-shadow:inset 3px 0 0 rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.1)}
.cover.s{width:44px;height:64px;font-size:1.5rem}
.cover.m{width:72px;height:106px;font-size:2.2rem}
.cover.l{width:96px;height:140px;font-size:3rem}

.now{display:flex;gap:16px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:16px;text-align:left;width:100%}
.now .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.now h3{font-size:calc(1.4rem*var(--ds));line-height:1.1}
.bar{height:6px;border-radius:var(--rp);background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .5s}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .meta{flex:1;min-width:0}
.item .t{font-family:var(--display);font-size:calc(1.18rem*var(--ds));font-weight:var(--dw);line-height:1.15;overflow-wrap:anywhere}
.item .a{font-size:.85rem;color:var(--muted)}
.pill{font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;padding:3px 9px;border-radius:var(--rp);white-space:nowrap;font-weight:500}
.pill.reading{background:var(--primary);color:var(--on-primary)}
.pill.want{background:var(--soft);color:var(--ink)}
.pill.done{box-shadow:inset 0 0 0 1px var(--muted);color:var(--muted)}
.pill.ex{box-shadow:inset 0 0 0 1px var(--line);color:var(--muted)}
.banner{background:var(--soft);border-radius:calc(var(--rc)*.8);padding:12px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 12px 26px -12px var(--primary);padding:13px 20px}
@media (min-width:700px){.fab{right:calc(50% - 320px + 18px)}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.68rem;letter-spacing:.04em;color:var(--muted);min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--primary)}
nav.tabs button[aria-current="page"] svg{color:var(--accent)}

/* habit */
.habit{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:18px;display:flex;flex-direction:column;gap:14px}
.streak{display:flex;align-items:center;gap:14px}
.streak .num{font-family:var(--display);font-size:calc(3.2rem*var(--ds));line-height:.9;font-weight:var(--dw);color:var(--accent)}
.streak .lab{display:flex;flex-direction:column;font-size:.85rem;color:var(--muted)}
.streak .lab b{color:var(--ink);font-weight:500;font-size:1rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.week span{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}
.week span.l1{background:var(--soft);box-shadow:none}
.week span.l2{background:color-mix(in srgb,var(--accent) 45%,var(--soft));box-shadow:none}
.week span.l3{background:var(--accent);box-shadow:none;color:var(--on-accent)}
.week span svg{width:14px;height:14px}
.week .td span{outline:1.5px solid var(--gold);outline-offset:2px}

/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between}
.iconbtn{background:none;border:1px solid var(--line);border-radius:var(--rp);width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:10px}
.cal .dow{font-size:.68rem;text-align:center;color:var(--muted);letter-spacing:.08em;padding:4px 0}
.day{border:0;background:none;border-radius:50%;aspect-ratio:1;max-width:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-variant-numeric:tabular-nums;font-size:.92rem;position:relative;color:var(--ink)}
.day.blank{pointer-events:none}
.day.l1{background:var(--soft)}
.day.l2{background:color-mix(in srgb,var(--accent) 40%,var(--soft))}
.day.l3{background:var(--accent);color:var(--on-accent)}
.day.today::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:1.5px solid var(--gold)}
.day.sel{outline:2px solid var(--ink);outline-offset:1px}
.day.future{opacity:.45}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:hsl(calc(var(--th,340) + var(--h) - 340) 50% 55%)}
.day.l3 .dots i{background:var(--on-accent)}
.legend{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:calc(var(--rc)*.8);padding:12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:calc(1.8rem*var(--ds));line-height:1;font-weight:var(--dw)}
.stat span{font-size:.74rem;color:var(--muted)}
.ev{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .sw{width:10px;height:10px;border-radius:50%;background:hsl(calc(var(--th,340) + var(--h) - 340) 50% 55%);flex:none}
.ev .sw.ck{background:var(--gold)}

/* stats */
.goal{display:flex;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:18px}
.goal svg{width:112px;height:112px;flex:none}
.goal .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;line-height:1}
.chart{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:16px;display:flex;flex-direction:column;gap:10px}
.bars{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;align-items:end;height:140px;position:relative}
.bars .b{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.bars .b i{display:block;width:100%;max-width:26px;background:var(--soft);border-radius:6px 6px 2px 2px;min-height:2px}
.bars .b.cur i{background:var(--accent)}
.bars .b em{font-style:normal;font-size:.62rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.bars-x{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:6px;font-size:.68rem;color:var(--muted);text-align:center}
.heat{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:3px;width:100%}
.heat i{display:block;width:100%;height:0;padding-top:100%;border-radius:3px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line)}
.heat i.l1{background:var(--soft);box-shadow:none}
.heat i.l2{background:color-mix(in srgb,var(--accent) 45%,var(--soft));box-shadow:none}
.heat i.l3{background:var(--accent);box-shadow:none}
.heat i.x{visibility:hidden}

.quote{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px}
.quote blockquote{margin:0;font-family:var(--display);font-size:calc(1.32rem*var(--ds));line-height:1.35;font-style:italic;overflow-wrap:anywhere}
.quote blockquote::before{content:"\201C";color:var(--gold);font-size:2.2rem;line-height:0;vertical-align:-.45em;margin-right:2px}
.quote .src{font-size:.82rem;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.quote img{border-radius:var(--ri);max-height:180px;object-fit:cover;width:100%}

.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.panel{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92dvh;overflow:auto;overscroll-behavior:contain;background:var(--surface);border-radius:calc(var(--rc) + 4px) calc(var(--rc) + 4px) 0 0;z-index:51;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.panel.on{transform:none}
.sheet-h{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 10px;z-index:2}
.sheet-h::before{content:"";position:absolute;top:7px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:4px;background:var(--line)}
.scan{display:flex;gap:14px;align-items:center;border:1.5px dashed var(--accent);border-radius:var(--rc);padding:16px;cursor:pointer;background:var(--raised);text-align:left;width:100%;color:var(--ink)}
.scan svg{width:30px;height:30px;color:var(--accent);flex:none}
.scan b{display:block;font-weight:600}
.scan-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scan-opts .scan{flex-direction:column;align-items:flex-start;gap:8px;padding:14px}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint.ok{color:var(--primary);font-weight:500}
.live{position:relative;border-radius:var(--rc);overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.live video{width:100%;height:100%;object-fit:cover;display:block}
.live .guide{position:absolute;left:10%;right:10%;top:32%;bottom:32%;border:2px solid rgba(255,255,255,.9);border-radius:var(--ri);box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.live .guide::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--accent);animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{transform:translateY(-28px)}to{transform:translateY(28px)}}
.live p{position:absolute;left:0;right:0;bottom:8px;margin:0;text-align:center;color:#fff;font-size:.82rem;text-shadow:0 1px 3px #000}
.d-top{display:flex;gap:16px;align-items:flex-end}
.d-top .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.d-top h2{overflow-wrap:anywhere}
.bm{background:var(--raised);border:1px solid var(--line);border-radius:var(--rc);padding:16px;display:flex;flex-direction:column;gap:12px}
.bm .big{font-family:var(--display);font-size:calc(2.6rem*var(--ds));line-height:1;font-weight:var(--dw)}
.bm .big small{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:400;margin-left:4px}
.lg{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.lg:last-child{border-bottom:0}
.x{background:none;border:0;color:var(--muted);font-size:1.1rem;width:36px;height:36px;border-radius:50%;flex:none}
.note{background:var(--raised);border-radius:var(--ri);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.words{display:flex;flex-wrap:wrap;gap:4px 3px;background:var(--raised);border-radius:var(--ri);padding:12px;max-height:260px;overflow:auto;font-family:var(--display);font-size:1.15rem;line-height:1.5}
.words button{border:0;background:none;padding:0 2px;border-radius:4px;font:inherit}
.words button.hl{background:var(--soft);box-shadow:0 2px 0 var(--accent)}
.qimg{border-radius:var(--ri);max-height:240px;object-fit:contain;width:100%;background:var(--raised)}
.toast{position:fixed;left:50%;bottom:calc(144px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--rp);font-size:.9rem;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--rc);padding:16px;display:flex;flex-direction:column;gap:12px}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sw-btn{border:1px solid var(--line);background:var(--surface);border-radius:calc(var(--rc)*.8);padding:10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.sw-btn[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw-btn .strip{display:flex;height:26px;border-radius:8px;overflow:hidden}
.sw-btn .strip i{flex:1}
pre.bk{white-space:pre-wrap;word-break:break-all;font-size:.72rem;max-height:160px;overflow:auto;background:var(--raised);border-radius:var(--ri);padding:10px;margin:0}
.update{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:90;display:flex;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none;transform:translateY(-140%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.update.on{transform:none}
.update .in{pointer-events:auto;max-width:560px;width:100%;background:var(--primary);color:var(--on-primary);border-radius:var(--rc);padding:12px 12px 12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 14px 32px -14px rgba(0,0,0,.45)}
.update .in div{flex:1;min-width:0;font-size:.9rem;line-height:1.35}
.update .in b{display:block;font-weight:600}
.update button{border:0;border-radius:var(--rp);padding:9px 14px;font-weight:500;min-height:40px}
.update .go{background:var(--on-primary);color:var(--primary)}
.update .later{background:transparent;color:var(--on-primary);opacity:.8}
.whatsnew li{margin:4px 0}
.ver{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem;text-align:center;margin-top:28px}

function themePhase(){
  const m=S?S.settings.mode:'clock',ph=autoPhase(),lightPh=ph==='night'?'day':ph;

  if(m==='system')return darkMQ&&darkMQ.matches?'night':lightPh;

}
function tokens(pk,ph){

  const l=Object.assign({},P.light);

  if(tint&&S&&S.settings.tint!==false){for(const k of ['bg','raised'])l[k]=mix(l[k],tint[0],tint[1]);for(const k of ['surface','soft','line'])l[k]=mix(l[k],tint[0],tint[2])}
  return Object.assign(l,{glassline:'rgba(255,255,255,.65)',glow:ph==='dawn'?'rgba(255,216,198,.55)':ph==='golden'?'rgba(240,176,138,.4)':rgba(l.soft,.95),scrim:rgba(l.ink,.42),covS:'28%',covL:'85%',covInk:l.ink,scheme:'light'});
}
let curTheme='';
function applyTheme(force){
  const ph=themePhase(),pk=(S&&S.settings.palette)||'rosegold',key=pk+ph+(S&&S.settings.tint)+(pk==='custom'?S.settings.customColor:'');
  if(key===curTheme&&!force)return;curTheme=key;
  const t=tokens(pk,ph),r=document.documentElement;

  r.style.setProperty('--th',paletteHue(pk));

}

/* ---------- images ---------- */
function compress(src,max,q){return new Promise((res,rej)=>{const img=new Image();const url=typeof src==='string'?src:URL.createObjectURL(src);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);if(typeof src!=='string')URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('image'));img.src=url})}
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}

/* ---------- barcode scanning ---------- */
let nativeDet=null,zx=null;
async function getNative(){
  if(nativeDet!==null)return nativeDet;nativeDet=false;
  if('BarcodeDetector' in window){try{let fm=['ean_13','ean_8','upc_a','upc_e','qr_code','code_128'];const sup=await BarcodeDetector.getSupportedFormats();fm=fm.filter(x=>sup.includes(x));if(fm.length)nativeDet=new BarcodeDetector({formats:fm})}catch(e){nativeDet=false}}
  return nativeDet;
}
async function getZX(){
  if(zx)return zx;
  if(!window.ZXing)await loadScript('vendor/zxing.min.js');
  const Z=window.ZXing,h=new Map();
  h.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.QR_CODE,Z.BarcodeFormat.CODE_128]);
  h.set(Z.DecodeHintType.TRY_HARDER,true);
  const r=new Z.MultiFormatReader();r.setHints(h);zx={Z,r};return zx;
}
function lumSource(Z,c){
  if(Z.HTMLCanvasElementLuminanceSource)return new Z.HTMLCanvasElementLuminanceSource(c);
  const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,g=new Uint8ClampedArray(c.width*c.height);
  for(let i=0,j=0;j<g.length;i+=4,j++)g[j]=(d[i]*306+d[i+1]*601+d[i+2]*117)>>10;
  return new Z.RGBLuminanceSource(g,c.width,c.height);
}
function zxCanvas(c){try{const {Z,r}=zx;const src=lumSource(Z,c);const bmp=new Z.BinaryBitmap(new Z.HybridBinarizer(src));const res=r.decodeWithState(bmp);r.reset();return res.getText()}catch(e){try{zx.r.reset()}catch(_){}return null}}
function drawTo(src,sw,sh,crop,w,rot){
  // crop = [x,y,w,h] in source pixels; output width w; rot 0|90
  const c=document.createElement('canvas'),k=w/crop[2];
  const ow=Math.round(crop[2]*k),oh=Math.round(crop[3]*k);
  c.width=rot?oh:ow;c.height=rot?ow:oh;const g=c.getContext('2d',{willReadFrequently:true});
  if(rot){g.translate(c.width/2,c.height/2);g.rotate(Math.PI/2);g.drawImage(src,crop[0],crop[1],crop[2],crop[3],-ow/2,-oh/2,ow,oh)}
  else g.drawImage(src,crop[0],crop[1],crop[2],crop[3],0,0,ow,oh);
  return c;
}
async function decodePhoto(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);const W=img.naturalWidth,H=img.naturalHeight;
    const nd=await getNative();
    if(nd){try{const r=await nd.detect(img);if(r&&r.length)return r[0].rawValue}catch(e){}}
    await getZX();
    const full=[0,0,W,H],mid=[W*.1,H*.25,W*.8,H*.5],midTall=[W*.25,H*.1,W*.5,H*.8];
    const tries=[[full,1000,0],[mid,1000,0],[full,1600,0],[full,1000,1],[midTall,1000,1],[mid,700,0],[full,700,0]];
    for(const [crop,w,rot] of tries){const t=zxCanvas(drawTo(img,W,H,crop,w,rot));if(t)return t}
    return null;
  }finally{URL.revokeObjectURL(url)}
}
let live=null;
const canLive=()=>!framed&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
async function startLive(){
  if(live)return;
  const box=$('#liveBox'),v=$('#liveV'),m=$('#scanMsg');box.hidden=false;$('#scanOpts').hidden=true;
  m.className='hint';m.textContent='Starting the camera…';
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    live={stream,stop:false,n:0};v.srcObject=stream;v.setAttribute('playsinline','');v.muted=true;await v.play();
    m.textContent='Hold the barcode inside the frame, about a hand’s length away.';
    const nd=await getNative();if(!nd)await getZX();
    const tick=async()=>{
      if(!live||live.stop)return;
      const W=v.videoWidth,H=v.videoHeight;let code=null;
      if(W&&H){
        if(nd){try{const r=await nd.detect(v);if(r&&r.length)code=r[0].rawValue}catch(e){}}
        else{const crop=[W*.08,H*.28,W*.84,H*.44];live.n++;code=zxCanvas(drawTo(v,W,H,crop,live.n%2?900:640,0));if(!code&&live.n%5===0)code=zxCanvas(drawTo(v,W,H,[0,0,W,H],800,0))}
      }
      if(code){stopLive();if(navigator.vibrate)navigator.vibrate(60);handleCode(code);return}
      setTimeout(tick,nd?150:90);
    };tick();
  }catch(err){stopLive();m.className='hint';m.textContent=err&&err.name==='NotAllowedError'?'Camera access was blocked. Allow the camera for this site in your phone’s settings, or use Take a photo.':'The camera couldn’t start. Use Take a photo instead.'}
}
function stopLive(){
  if(live){live.stop=true;try{live.stream.getTracks().forEach(t=>t.stop())}catch(e){}live=null}
  const b=$('#liveBox');if(b)b.hidden=true;const o=$('#scanOpts');if(o)o.hidden=false;
}

/* ---------- ISBN ---------- */
function toIsbn13(x){
  x=x.replace(/[^0-9Xx]/g,'').toUpperCase();
  if(/^97[89]\d{10}$/.test(x))return x;
  if(/^\d{9}[\dX]$/.test(x)){const b='978'+x.slice(0,9);let s=0;for(let i=0;i<12;i++)s+=(+b[i])*(i%2?3:1);return b+((10-s%10)%10)}
  return null;
}
async function fetchJSON(url,ms){const ac=new AbortController();const t=setTimeout(()=>ac.abort(),ms||8000);try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw new Error('http '+r.status);return await r.json()}finally{clearTimeout(t)}}
async function coverData(url){
  if(!url)return null;
  try{const ac=new AbortController();setTimeout(()=>ac.abort(),8000);const r=await fetch(url,{signal:ac.signal});if(!r.ok)return null;const b=await r.blob();if(b.size<1200)return null;return await compress(b,360,.78)}catch(e){return null}
}
async function lookupIsbn(isbn){
  if(!navigator.onLine)throw new Error('offline');
  let found=null,errs=0;
  try{const j=await fetchJSON('https://www.googleapis.com/books/v1/volumes?q=isbn:'+isbn);const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
    if(v)found={title:v.title+(v.subtitle?': '+v.subtitle:''),author:(v.authors||[]).join(', '),pages:v.pageCount||'',cover:v.imageLinks&&(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail)?(v.imageLinks.thumbnail||v.imageLinks.smallThumbnail).replace('http:','https:').replace('&edge=curl',''):null}}catch(e){errs++}
  if(!found||!found.pages||!found.author){
    try{const j=await fetchJSON('https://openlibrary.org/api/books?bibkeys=ISBN:'+isbn+'&format=json&jscmd=data');const d=j['ISBN:'+isbn];
      if(d){const ol={title:d.title+(d.subtitle?': '+d.subtitle:''),author:(d.authors||[]).map(a=>a.name).join(', '),pages:d.number_of_pages||'',cover:d.cover&&(d.cover.medium||d.cover.small)||null};
        found=found?{title:found.title||ol.title,author:found.author||ol.author,pages:found.pages||ol.pages,cover:found.cover||ol.cover}:ol}}catch(e){errs++}
  }
  if(!found&&errs===2)throw new Error('network');
  if(found&&!found.cover)found.cover='https://covers.openlibrary.org/b/isbn/'+isbn+'-M.jpg?default=false';
  return found;
}
async function fillFromIsbn(isbn){
  const m=$('#scanMsg');m.className='hint';m.textContent='Looking up ISBN '+isbn+'…';
  try{
    const r=await lookupIsbn(isbn);
    if(!r){m.textContent='No book found for ISBN '+isbn+'. It’s saved; type the title below.';return}
    if(r.title)$('#fTitle').value=r.title;if(r.author)$('#fAuthor').value=r.author;if(r.pages)$('#fPages').value=r.pages;
    m.className='hint ok';m.textContent='Found it. Check the details, then add to your shelf.';
    if(r.cover&&!window._cover){const c=await coverData(r.cover);if(c&&$('#covPrev')){window._cover=c;$('#covPrev').innerHTML=`<img class="cover s" src="${c}" alt="">`}}
  }catch(e){m.className='hint';m.textContent=e.message==='offline'?'You’re offline. The ISBN is saved; type the title below, or tap Look up later.':'Couldn’t reach the book catalogues. Check the connection and tap Look up again.'}
}
async function handleCode(code){
  const m=$('#scanMsg');if(!m)return;
  const isbn=toIsbn13(code);
  if(isbn){$('#fIsbn').value=isbn;await fillFromIsbn(isbn)}
  else if(/^\d{12}$/.test(code)){$('#fIsbn').value=code;m.className='hint';m.textContent='That’s a store barcode (UPC), not the ISBN. Look for the barcode starting 978 or 979, often on the back cover or inside.'}
  else{if(!$('#fTitle').value)$('#fTitle').value=code.slice(0,200);m.className='hint ok';m.textContent='Scanned a code. Its text was added as the title; edit as needed.'}
}

let ocrWorker=null;
async function getWorker(){
  if(ocrWorker)return ocrWorker;
  if(!window.Tesseract)await loadScript('vendor/tesseract/tesseract.min.js');
  ocrWorker=await Tesseract.createWorker('eng',1,{workerPath:'vendor/tesseract/worker.min.js',corePath:'vendor/core',langPath:'vendor/lang',workerBlobURL:false});
  return ocrWorker;
}
async function prepareReader(){const w=await getWorker();try{localStorage.setItem('pp-ocr-ready','1')}catch(e){}return w}
function readerReady(){try{return localStorage.getItem('pp-ocr-ready')==='1'}catch(e){return false}}
async function recognize(dataUrl){
  const job=prepareReader().then(w=>w.recognize(dataUrl));
  const r=await Promise.race([job,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),90000))]);
  return r.data.text||'';

/* ---------- reading data ---------- */
function dayStats(){
  const m={},g=d=>m[d]||(m[d]={pages:0,min:0,books:new Set(),ev:[],check:false});
  S.books.forEach(b=>{
    let prev=0;[...b.sessions].sort((a,c)=>a.date.localeCompare(c.date)||a.page-c.page).forEach(s=>{
      const delta=Math.max(0,s.page-prev);prev=Math.max(prev,s.page);const x=g(s.date);
      x.pages+=delta;x.min+=(+s.min||0);x.books.add(b.id);x.ev.push({t:'read',b,page:s.page,delta,min:+s.min||0})});
    if(b.start)g(b.start).ev.push({t:'start',b});if(b.finish)g(b.finish).ev.push({t:'finish',b});
  });
  Object.entries(Object.assign({},S.exCheckins,S.checkins)).forEach(([d,min])=>{const x=g(d);x.min+=(+min||0);x.check=true;x.ckMin=+min||0});
  Object.values(m).forEach(x=>x.read=x.books.size>0||x.check);
  return m;
}
function level(x){
  if(!x||!x.read)return 0;const G=S.settings.goal;const v=G.type==='pages'?x.pages:x.min;
  if(!G.value)return 3;const r=v/G.value;return r>=1?3:r>=.5?2:1;
}
function streaks(M){
  const days=Object.keys(M).filter(k=>M[k].read).sort();const set=new Set(days);
  let cur=0,d=today();if(!set.has(d))d=addDays(d,-1);while(set.has(d)){cur++;d=addDays(d,-1)}
  let best=0,run=0,last=null;days.forEach(k=>{run=last&&addDays(last,1)===k?run+1:1;best=Math.max(best,run);last=k});
  return{cur,best,readToday:set.has(today())};
}

function calendarHTML(){

  const y=calMonth.getFullYear(),mo=calMonth.getMonth(),startDow=new Date(y,mo,1).getDay(),n=new Date(y,mo+1,0).getDate(),td=today();
  let cells='';['S','M','T','W','T','F','S'].forEach(d=>cells+=`<div class="dow">${d}</div>`);
  for(let i=0;i<startDow;i++)cells+='<div class="day blank"></div>';

  for(let d=1;d<=n;d++){
    const k=y+'-'+pad(mo+1)+'-'+pad(d),x=M[k],lv=level(x);
    if(x&&x.read){readDays++;pages+=x.pages;mins+=x.min;if(lv===3)met++}
    const hues=x?[...new Set(x.ev.filter(e=>e.t==='read').map(e=>e.b.hue))].slice(0,3):[];
    cells+=`<button class="day l${lv}${k===td?' today':''}${k===selDay?' sel':''}${k>td?' future':''}" data-act="day" data-v="${k}" aria-label="${fmt(k)}${x&&x.read?', read':''}"><span>${d}</span><span class="dots">${hues.map(h=>`<i style="--h:${h}"></i>`).join('')}</span></button>`;
  }
  const x=M[selDay],E=x?x.ev:[];
  const evHTML=(E.length||(x&&x.check))?[...(x&&x.check?[`<div class="ev"><span class="sw ck"></span><div style="flex:1"><b style="font-weight:500">Checked in as read</b><div class="small muted">${x.ckMin?x.ckMin+' minutes':'No time recorded'}</div></div></div>`]:[]),...E.map(e=>`<div class="ev"><span class="sw" style="--h:${e.b.hue}"></span><div style="flex:1;min-width:0"><b style="font-family:var(--display);font-size:1.1rem">${esc(e.b.title)}</b><div class="small muted tnum">${e.t==='read'?`Read to page ${e.page}${e.delta?` · ${e.delta} pages`:''}${e.min?` · ${e.min} min`:''}`:e.t==='start'?'Started reading':'Finished the book'}</div></div><button class="link" data-act="open" data-id="${e.b.id}">Open</button></div>`)].join(''):`<p class="muted small" style="margin:0">Nothing logged this day.</p>`;
  return`${header(`<h1>Reading <em>habit</em></h1>`)}
  <div class="section">${habitCard(M,st,selDay>td?td:selDay)}</div>
  <div class="section">
    <div class="cal-h"><button class="iconbtn" data-act="calprev" aria-label="Previous month">${I.prev}</button><h2>${calMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><button class="iconbtn" data-act="calnext" aria-label="Next month">${I.next}</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><i style="background:var(--soft)"></i>Read <i style="background:color-mix(in srgb,var(--accent) 40%,var(--soft))"></i>Half the goal <i style="background:var(--accent)"></i>Goal met · dots show the books</div>
    <div class="grid3 tnum"><div class="stat"><b>${readDays}</b><span>days read</span></div><div class="stat"><b>${met}</b><span>goal met</span></div><div class="stat"><b>${pages}</b><span>pages</span></div></div>
  </div>
  <div class="section"><h3>${fmt(selDay)}</h3><div>${evHTML}</div><p class="hint">Tap any past day in the calendar to see it or mark it as read.</p></div>`;
}

function statsHTML(){
  const M=dayStats(),st=streaks(M),yr=new Date().getFullYear(),cm=new Date().getMonth();
  const yk=Object.keys(M).filter(k=>k.startsWith(yr+'-')&&M[k].read);
  const pagesY=yk.reduce((s,k)=>s+M[k].pages,0),minY=yk.reduce((s,k)=>s+M[k].min,0);
  const fin=S.books.filter(b=>b.status==='done'&&b.finish&&pd(b.finish).getFullYear()===yr).sort((a,b)=>b.finish.localeCompare(a.finish));
  const durs=fin.filter(b=>b.start).map(b=>Math.round((pd(b.finish)-pd(b.start))/864e5)+1);
  const avgDays=durs.length?Math.round(durs.reduce((a,c)=>a+c,0)/durs.length):0;
  const goal=S.settings.yearGoal||12,frac=Math.min(1,fin.length/goal);
  const R=46,C=2*Math.PI*R;
  const mp=Array(12).fill(0);yk.forEach(k=>mp[+k.slice(5,7)-1]+=M[k].pages);const mmax=Math.max(1,...mp);
  const wd=Array(7).fill(0);Object.keys(M).filter(k=>M[k].read).forEach(k=>wd[pd(k).getDay()]++);const wmax=Math.max(1,...wd);
  const bestWd=wd.indexOf(Math.max(...wd));
  // heatmap: last 26 weeks ending this week
  const weeks=26,end=pd(today());const startD=new Date(end);startD.setDate(end.getDate()-end.getDay()-(weeks-1)*7);
  let heat='';for(let i=0;i<weeks*7;i++){const d=new Date(startD);d.setDate(startD.getDate()+i);const k=ds(d);heat+=k>today()?'<i class="x"></i>':`<i class="l${level(M[k])}" title="${fmt(k)}"></i>`}
  const reading=S.books.filter(b=>b.status==='reading');
  return`${header(`<h1>Reading <em>stats</em></h1>`)}
  <div class="section">${companionCard()}</div>
  <div class="section"><div class="goal">
    <svg viewBox="0 0 112 112" role="img" aria-label="${fin.length} of ${goal} books"><circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--soft)" stroke-width="9"/><circle cx="56" cy="56" r="${R}" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 56 56)"/><text x="56" y="58" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="32" font-weight="600" fill="var(--ink)">${fin.length}</text><text x="56" y="76" text-anchor="middle" font-size="11" fill="var(--muted)">of ${goal}</text></svg>
    <div class="meta"><div class="eyebrow">${yr} reading goal</div><h3>${fin.length>=goal?'Goal reached!':`${goal-fin.length} book${goal-fin.length===1?'':'s'} to go`}</h3>
      <div class="stepper"><button data-act="ygoal" data-v="-1" aria-label="Lower goal">−</button><span class="small tnum">${goal} books</span><button data-act="ygoal" data-v="1" aria-label="Raise goal">+</button></div></div>
  </div></div>
  <div class="section"><div class="grid3 tnum">
    <div class="stat"><b>${st.cur}</b><span>day streak</span></div><div class="stat"><b>${st.best}</b><span>best streak</span></div><div class="stat"><b>${yk.length}</b><span>days read</span></div>
    <div class="stat"><b>${pagesY.toLocaleString()}</b><span>pages this year</span></div><div class="stat"><b>${Math.round(minY/60)}</b><span>hours this year</span></div><div class="stat"><b>${yk.length?Math.round(pagesY/yk.length):0}</b><span>pages per reading day</span></div>
  </div></div>
  <div class="section"><div class="chart"><div class="section-h"><h3>Pages by month</h3><span class="small muted">${yr}</span></div>
    <div class="bars" style="--n:12">${mp.map((v,i)=>`<div class="b${i===cm?' cur':''}">${v?`<em>${v}</em>`:''}<i style="height:${(v/mmax*100).toFixed(1)}%"></i></div>`).join('')}</div>
    <div class="bars-x" style="--n:12">${MON.map(m=>`<span>${m}</span>`).join('')}</div></div></div>
  <div class="section"><div class="chart"><div class="section-h"><h3>Last six months</h3><span class="small muted">each square is a day</span></div>
    <div class="heat" aria-label="Reading days, last 26 weeks">${heat}</div>
    <div class="legend"><i style="background:var(--soft);border-radius:3px"></i>Read <i style="background:color-mix(in srgb,var(--accent) 45%,var(--soft));border-radius:3px"></i>Half the goal <i style="background:var(--accent);border-radius:3px"></i>Goal met</div></div></div>
  <div class="section"><div class="chart"><div class="section-h"><h3>When she reads</h3><span class="small muted">${Math.max(...wd)?['Sundays','Mondays','Tuesdays','Wednesdays','Thursdays','Fridays','Saturdays'][bestWd]+' most':''}</span></div>
    <div class="bars" style="--n:7;height:90px">${wd.map((v,i)=>`<div class="b${i===bestWd&&v?' cur':''}">${v?`<em>${v}</em>`:''}<i style="height:${(v/wmax*100).toFixed(1)}%"></i></div>`).join('')}</div>
    <div class="bars-x" style="--n:7">${['S','M','T','W','T','F','S'].map(d=>`<span>${d}</span>`).join('')}</div></div></div>
  <div class="section"><div class="section-h"><h3>Finished in ${yr}</h3><span class="small muted">${avgDays?`about ${avgDays} days per book`:''}</span></div>
    ${fin.length?`<div class="list">${fin.map(b=>`<button class="item" data-act="open" data-id="${b.id}">${cover(b,'s')}<div class="meta"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author||'')} · ${fmt(b.finish)}${b.start?` · ${Math.round((pd(b.finish)-pd(b.start))/864e5)+1} days`:''}</div></div></button>`).join('')}</div>`:`<p class="muted small" style="margin:0">Finished books show up here.</p>`}
  </div>
  ${reading.length?`<div class="section"><h3>In progress</h3>${reading.map(b=>{const days=b.start?Math.max(1,Math.round((pd(today())-pd(b.start))/864e5)+1):0;const rate=days?(b.page||0)/days:0;const left=b.pages?Math.max(0,b.pages-(b.page||0)):0;const eta=rate&&left?Math.ceil(left/rate):0;
    return`<div class="lg"><span style="min-width:0"><b style="font-family:var(--display);font-size:1.1rem">${esc(b.title)}</b><br><span class="small muted tnum">${pct(b)}% · ${rate?rate.toFixed(0)+' pages a day':'no pages logged yet'}</span></span><span class="small muted tnum" style="text-align:right">${eta?`about ${eta} day${eta===1?'':'s'} left`:''}</span></div>`}).join('')}</div>`:''}`;
}

function chipset(act,cur,opts){return`<div class="chips">${opts.map(([k,l])=>`<button class="chip" data-act="${act}" data-v="${k}" aria-pressed="${cur===k}">${l}</button>`).join('')}</div>`}
function ensurePreviewFonts(){
  const l=$('#fontpreview');if(!l||l.dataset.ok)return;
  const fam=[...FONTS_D,...FONTS_B].filter(f=>f.spec!==null);const seen=new Set();const parts=[];
  fam.forEach(f=>{if(!seen.has(f.n)){seen.add(f.n);parts.push('family='+f.n.replace(/ /g,'+'))}});
  const text=encodeURIComponent([...new Set([...FONTS_D,...FONTS_B].map(f=>f.n).join('')+'AaBbGgPp&')].join(''));
  l.href='https://fonts.googleapis.com/css2?'+parts.join('&')+'&text='+text+'&display=swap';l.disabled=false;l.dataset.ok=1;
}

let sheetFor=null;

  const p=$('#panel'),sc=$('#scrim');const keep=sheetFor===key?p.scrollTop:0;sheetFor=key;

      <div class="big tnum">p. ${b.page||0}${b.pages?`<small>of ${b.pages} · ${pct(b)}%</small>`:''}</div>
      ${b.pages?`<div class="bar"><i style="width:${pct(b)}%"></i></div>`:''}
      <div class="grid2"><div class="field"><label for="pgIn">Stopped at page</label><input type="number" inputmode="numeric" id="pgIn" min="0" placeholder="${(b.page||0)+1}"></div><div class="field"><label for="pgMin">Minutes read</label><input type="number" inputmode="numeric" id="pgMin" min="0" placeholder="optional"></div></div>

      ${S2.length?`<div><div class="lbl" style="margin:4px 0">Reading log</div>${S2.slice(0,8).map(s=>`<div class="lg tnum"><span>${fmt(s.date)}</span><span>page ${s.page}${s.min?` · ${s.min} min`:''}</span><button class="x" data-act="delsess" data-id="${b.id}" data-s="${s.id}" aria-label="Remove entry">✕</button></div>`).join('')}${S2.length>8?`<p class="hint">+ ${S2.length-8} earlier entries in the calendar</p>`:''}</div>`:''}
    </div>
    <div class="section" style="margin-top:12px"><div class="section-h"><h3>Quotes</h3><span class="small muted">${b.quotes.length}</span></div>
      <button class="btn ghost" data-act="addquote" data-id="${b.id}">${I.cam} Capture a quote</button>
      ${[...b.quotes].sort((a,c)=>c.date.localeCompare(a.date)).map(q=>quoteCard(q,b,false)).join('')}
    </div>
    <div class="section" style="margin-top:12px"><div class="section-h"><h3>Notes</h3><span class="small muted">${b.notes.length}</span></div>
      <textarea id="noteIn" placeholder="Thoughts, comments, who recommended it…"></textarea>
      <button class="btn soft" data-act="addnote" data-id="${b.id}">Add note</button>
      ${[...b.notes].sort((a,c)=>c.date.localeCompare(a.date)).map(n=>`<div class="note"><div class="row" style="justify-content:space-between"><span class="small muted">${fmt(n.date)}</span><button class="x" data-act="delnote" data-id="${b.id}" data-n="${n.id}" aria-label="Delete note">✕</button></div><p>${esc(n.text)}</p></div>`).join('')}
    </div>
    <button class="btn danger" data-act="delbook" data-id="${b.id}" style="margin-top:20px">Delete this book</button>
  </div>`;
}

function renderWords(){
  const el=$('#words');if(!el)return;const lo=Q.a==null?-1:Math.min(Q.a,Q.b??Q.a),hi=Q.a==null?-1:Math.max(Q.a,Q.b??Q.a);
  el.innerHTML=Q.words.map((w,i)=>`<button data-act="w" data-i="${i}" class="${i>=lo&&i<=hi?'hl':''}">${esc(w)}</button>`).join('');
  if(lo>=0)$('#qText').value=Q.words.slice(lo,hi+1).join(' ').replace(/(\w)- (\w)/g,'$1$2');
}

/* ---------- actions ---------- */
function setStatus(b,v){
  b.status=v;
  if(v==='reading'&&!b.start)b.start=today();
  if(v==='done'){if(!b.finish)b.finish=today();if(b.pages&&(b.page||0)<b.pages){b.page=b.pages;b.sessions.push({id:uid(),date:b.finish,page:b.pages})}if(!b.start)b.start=b.finish}
  if(v!=='done')b.finish='';
}
function backupText(){return JSON.stringify({app:'petal-page',version:2,saved:new Date().toISOString(),...S})}
async function doRestore(text){
  let d;try{d=JSON.parse(text)}catch(e){toast('That isn’t a valid backup. Check you copied all of it.');return false}
  if(!d||!Array.isArray(d.books)){toast('No books found in that backup.');return false}
  S=normalize({books:d.books,settings:d.settings,checkins:d.checkins,exCheckins:d.exCheckins});await save();applyStyle();applyTheme(true);render();toast('Restored '+S.books.length+' books');return true;
}

    case'uncheck':delete S.checkins[t.dataset.v];delete S.exCheckins[t.dataset.v];await save();render();break;

    case'dgoal':{const G=S.settings.goal;G.value=Math.max(5,Math.min(300,(G.value||0)+(+t.dataset.v)));await save();render();break}
    case'ygoal':S.settings.yearGoal=Math.max(1,Math.min(365,(S.settings.yearGoal||12)+(+t.dataset.v)));await save();render();break;

    case'status':setStatus(b,t.dataset.v);await save();openDetail(id);break;

    case'delsess':{b.sessions=b.sessions.filter(s=>s.id!==t.dataset.s);const last=[...b.sessions].sort((x,y)=>y.date.localeCompare(x.date))[0];b.page=last?last.page:0;await save();openDetail(id);break}

      await save();openDetail(bk.id);toast(id?'Saved':'Added to your shelf');break}
    case'export':{try{const blob=new Blob([backupText()],{type:'application/json'});const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='petal-and-page-backup-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('Backup saved')}catch(err){toast('Couldn’t save a file here. Use Copy backup text.')}break}

const PIG=[
  {h:0,n:'Piglet',d:'Just discovering picture books'},
  {h:3,n:'Curious Piglet',d:'Turning pages with wonder'},
  {h:12,n:'Bookworm',d:'Found her reading glasses'},
  {h:35,n:'Scholar',d:'Graduated with honours'},
  {h:80,n:'Little Sage',d:'Tiny, but so very wise'},
  {h:160,n:'Grand Sage',d:'The littlest keeper of all the stories'}
];
function lifeMinutes(){return Object.values(dayStats()).reduce((s,x)=>s+(x.min||0),0)}
function pigLevel(min){const h=(min??lifeMinutes())/60;let i=0;PIG.forEach((p,k)=>{if(h>=p.h)i=k});return i}
function pigProgress(min){const m=min??lifeMinutes(),i=pigLevel(m),cur=PIG[i],nx=PIG[i+1];return{i,cur,nx,hours:m/60,frac:nx?Math.min(1,(m/60-cur.h)/(nx.h-cur.h)):1}}

  const tuft=lv<3?`<path d="M97 46 q2 -12 12 -8 q-7 1 -6 8" stroke="#EE9AB0" stroke-width="3.2" fill="none" stroke-linecap="round"/>`:'';
  const stack=lv>=4?`<g><rect x="150" y="176" width="38" height="10" rx="2" fill="#B66E7B"/><rect x="153" y="167" width="32" height="9" rx="2" fill="#5D6FA8"/><rect x="149" y="158" width="36" height="9" rx="2" fill="#C9A15E"/></g>`:'';

    <g class="head">
      <path class="earl" d="M56 74 Q46 42 78 50 Q70 66 56 74Z" fill="#F2A1B5"/><path d="M60 68 Q56 52 72 54 Q66 62 60 68Z" fill="#FBD3DD"/>
      <path class="earr" d="M144 74 Q154 42 122 50 Q130 66 144 74Z" fill="#F2A1B5"/><path d="M140 68 Q144 52 128 54 Q134 62 140 68Z" fill="#FBD3DD"/>
      ${bow}
      <circle cx="100" cy="98" r="52" fill="#F9C7D3"/>
      ${tuft}
      <ellipse cx="65" cy="116" rx="11" ry="7.5" fill="#F395AE" opacity=".55"/><ellipse cx="135" cy="116" rx="11" ry="7.5" fill="#F395AE" opacity=".55"/>
      <g class="open"><g class="scan"><g class="blinker"><ellipse cx="80" cy="100" rx="7.6" ry="9.2" fill="#3B2430"/><ellipse cx="120" cy="100" rx="7.6" ry="9.2" fill="#3B2430"/></g><circle cx="83" cy="96" r="3" fill="#fff"/><circle cx="123" cy="96" r="3" fill="#fff"/><circle cx="78" cy="104" r="1.4" fill="#fff"/><circle cx="118" cy="104" r="1.4" fill="#fff"/></g></g>
      <g class="closed" stroke="#3B2430" stroke-width="2.8" fill="none" stroke-linecap="round"><path d="M72 101 Q80 107 88 101"/><path d="M112 101 Q120 107 128 101"/></g>
      <ellipse cx="100" cy="119" rx="13.5" ry="9.5" fill="#F4A6B9" stroke="#EA90A7" stroke-width="1.3"/>
      <ellipse cx="95.5" cy="119" rx="2.2" ry="3" fill="#B95F79"/><ellipse cx="104.5" cy="119" rx="2.2" ry="3" fill="#B95F79"/>
      <path d="M95 132 Q100 136 105 132" stroke="#B95F79" stroke-width="2" fill="none" stroke-linecap="round"/>
      ${glasses}${cap}${hat}
    </g>
    ${book}
  </g></g>
  <g class="zzz" fill="var(--muted)"><text x="148" y="58" font-size="16">z</text><text x="158" y="44" font-size="20">z</text><text x="170" y="28" font-size="24">Z</text></g>
  </svg>`;
}
function pigFace(){return pigSVG(pigLevel(),'idle',true)}
function companionCard(){
  const p=pigProgress();
  return`<div class="card"><div class="companion"><div class="pv">${pigSVG(p.i,'idle')}</div><div class="meta"><div class="eyebrow">Reading companion</div><h3>${p.cur.n}</h3><span class="small muted">${p.cur.d}. ${Math.floor(p.hours)} hours read in all.</span>
    ${p.nx?`<div class="bar"><i style="width:${(p.frac*100).toFixed(1)}%"></i></div><span class="small muted tnum">${Math.max(1,Math.ceil(p.nx.h-p.hours))} more hour${Math.ceil(p.nx.h-p.hours)===1?'':'s'} to become a ${p.nx.n}</span>`:'<span class="small muted">The wisest pig of all.</span>'}
  </div></div><button class="btn" data-act="opentimer">Start reading timer</button></div>`;
}
function celebrate(lv){
  const c=document.createElement('div');c.className='confetti';const cols=['var(--accent)','var(--gold)','var(--soft)','var(--primary)'];
  for(let i=0;i<60;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'%';e.style.background=cols[i%4];e.style.animationDelay=(Math.random()*.8)+'s';e.style.transform=`rotate(${Math.random()*180}deg)`;c.appendChild(e)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),3800);
  if(navigator.vibrate)navigator.vibrate([40,60,40]);
  openSheet(`<div class="sheet-h"><h2>A new level!</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="stack" style="align-items:center;text-align:center"><div style="width:200px;height:210px">${pigSVG(lv,'party')}</div>
  <h3>Your piglet became a ${PIG[lv].n}</h3><p class="muted" style="margin:0">${PIG[lv].d}.${PIG[lv+1]?` Next: ${PIG[lv+1].n} at ${PIG[lv+1].h} hours.`:''}</p>
  <button class="btn wide" data-act="close">Wonderful</button></div>`,'levelup');
}
function checkLevelUp(){const lv=pigLevel();const seen=S.settings.pigSeen??lv;if(S.settings.pigSeen===undefined){S.settings.pigSeen=lv;save();return}if(lv>seen){S.settings.pigSeen=lv;save();setTimeout(()=>celebrate(lv),400)}else if(lv<seen){S.settings.pigSeen=lv;save()}}

/* ---------- reading timer ---------- */
let tView='run',tTick=null,wakeLock=null,audioCtx=null,goalChimed=false;
const T=()=>S.timer||(S.timer={state:'idle',bookId:null,startedAt:0,accMs:0});
const elapsedMs=()=>{const t=T();return t.accMs+(t.state==='running'?Date.now()-t.startedAt:0)};
const fmtClock=ms=>{const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+pad(m):m)+':'+pad(x)};
async function lockScreen(on){try{if(on&&'wakeLock' in navigator&&document.visibilityState==='visible'){wakeLock=await navigator.wakeLock.request('screen')}else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}
function chime(){try{if(!audioCtx)return;const n=audioCtx.currentTime;[659.25,880].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n+i*.22);g.gain.linearRampToValueAtTime(.18,n+i*.22+.02);g.gain.exponentialRampToValueAtTime(.001,n+i*.22+1.2);o.connect(g).connect(audioCtx.destination);o.start(n+i*.22);o.stop(n+i*.22+1.3)})}catch(e){}if(navigator.vibrate)navigator.vibrate([80,80,80])}
function goalMin(){const G=S.settings.goal;return G.type==='minutes'?G.value:20}
function todayMin(){const x=dayStats()[today()];return x?x.min:0}
function openTimer(bookId){
  const t=T();if(t.state==='idle'){if(bookId)t.bookId=bookId;else if(!t.bookId||!find(t.bookId)){const r=S.books.find(b=>b.status==='reading');t.bookId=r?r.id:null}}
  tView='run';const el=$('#timer');el.hidden=false;renderTimer();requestAnimationFrame(()=>el.classList.add('on'));
  startTick();updatePill();
}
function closeTimer(){const el=$('#timer');el.classList.remove('on');setTimeout(()=>{el.hidden=true;el.innerHTML=''},300);if(T().state!=='running')stopTick();updatePill();if(view)render()}
function startTick(){stopTick();tTick=setInterval(()=>{updateTimerFace();updatePill()},500)}
function stopTick(){if(tTick){clearInterval(tTick);tTick=null}}
function updatePill(){
  const p=$('#tpill'),t=T(),open=!$('#timer').hidden;
  if(t.state==='idle'||open){p.hidden=true;return}
  p.hidden=false;p.classList.toggle('paused',t.state==='paused');
  p.innerHTML=`<span class="pf">${pigSVG(pigLevel(),'idle',true)}</span><span class="dot"></span><span>${fmtClock(elapsedMs())}</span><span class="muted small">${t.state==='paused'?'Paused':'Reading'}</span>`;
  if(!tTick&&t.state==='running')startTick();
}
function ringFrac(){const g=goalMin()*60000;return Math.min(1,(todayMin()*60000+elapsedMs())/g)}
function updateTimerFace(){
  const d=$('#tDigits');if(!d)return;const ms=elapsedMs();d.textContent=fmtClock(ms);
  const f=ringFrac(),C=2*Math.PI*46;const arc=$('#tArc');if(arc)arc.setAttribute('stroke-dasharray',(C*f).toFixed(2)+' '+C.toFixed(2));
  const sub=$('#tSub');if(sub){const tot=Math.floor((todayMin()*60000+ms)/60000);sub.textContent=f>=1?`Daily goal reached · ${tot} min today`:`${tot} of ${goalMin()} min today`}
  if(T().state==='running'&&f>=1&&!goalChimed){goalChimed=true;chime();toast('Daily reading goal reached!')}
}
function renderTimer(){
  const t=T(),el=$('#timer'),p=pigProgress(),reading=S.books.filter(b=>b.status==='reading'),bk=t.bookId?find(t.bookId):null;
  const mode=t.state==='running'?'reading':t.state==='paused'?'sleep':'idle';
  const C=2*Math.PI*46;
  let body;
  if(tView==='finish'){
    const min=Math.max(1,Math.round(elapsedMs()/60000));
    body=`<div class="glass tcard"><div style="width:150px;height:158px">${pigSVG(p.i,'idle')}</div>
      <h2>Lovely reading!</h2><p class="muted" style="margin:0">You read for <b class="tnum" style="color:var(--ink)">${min} minute${min===1?'':'s'}</b>${bk?` of <i>${esc(bk.title)}</i>`:''}.</p>
      ${bk?`<div class="field" style="width:100%;text-align:left"><label for="tPage">Stopped at page</label><input type="number" inputmode="numeric" id="tPage" min="0" placeholder="${bk.page||0}${bk.pages?' of '+bk.pages:''}"></div>`:''}
      <button class="btn wide big-btn" data-act="tsave">Save session</button>
      <div class="row" style="justify-content:center"><button class="link" data-act="tback">Keep reading</button><button class="link" data-act="tdiscard" style="color:var(--muted)">Discard</button></div></div>`;
  }else{
    body=`<div class="glass tcard">
      <div class="ringbox"><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--glassline)" stroke-width="3"/><circle id="tArc" cx="50" cy="50" r="46" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 ${C.toFixed(2)}"/></svg><div class="pigwrap">${pigSVG(p.i,mode)}</div></div>
      <div class="digits" id="tDigits">${fmtClock(elapsedMs())}</div><div class="tsub" id="tSub"></div>
      ${t.state==='idle'?`<div class="tbooks" role="group" aria-label="What are you reading?">${reading.map(b=>`<button class="chip" data-act="tbook" data-v="${b.id}" aria-pressed="${t.bookId===b.id}">${esc(b.title.length>24?b.title.slice(0,22)+'…':b.title)}</button>`).join('')}<button class="chip" data-act="tbook" data-v="" aria-pressed="${!t.bookId}">Something else</button></div>`:`<div class="tsub">${t.state==='paused'?'Paused':'Reading'}${bk?` <i>${esc(bk.title)}</i>`:''}</div>`}
      <div class="tctl">${t.state==='idle'?`<button class="btn big-btn" data-act="tstart">Start reading</button>`:t.state==='running'?`<button class="btn big-btn gbtn" data-act="tpause">Pause</button><button class="btn big-btn" data-act="tfinish">Finish</button>`:`<button class="btn big-btn" data-act="tresume">Resume</button><button class="btn big-btn gbtn" data-act="tfinish">Finish</button>`}</div>
    </div>
    <div class="glass tcard" style="padding:16px"><div class="lvl"><span class="eyebrow">Your reading companion</span><b>${p.cur.n}</b><span class="small muted">${p.cur.d}</span>${p.nx?`<div class="bar"><i style="width:${(p.frac*100).toFixed(1)}%"></i></div><span class="small muted tnum">${Math.floor(p.hours)} h read · ${p.nx.n} at ${p.nx.h} h</span>`:`<span class="small muted tnum">${Math.floor(p.hours)} hours read</span>`}</div></div>`;
  }
  el.innerHTML=`<div class="blob b1"></div><div class="blob b2"></div><div class="wrap">
    <div class="top"><button class="iconbtn gbtn" data-act="tclose" aria-label="Close timer" style="border-radius:50%">${I.prev.replace('m14.5 6-6 6 6 6','M6 9.5l6 6 6-6')}</button><span class="eyebrow">Reading timer</span><span style="width:40px"></span></div>
    ${body}</div>`;
  updateTimerFace();
}
async function timerAct(a,t){
  const T0=T();
  switch(a){
    case'opentimer':if(sheetFor)closeSheet();openTimer(t.dataset.id||null);return true;
    case'tclose':closeTimer();return true;
    case'tbook':T0.bookId=t.dataset.v||null;await save();renderTimer();return true;
    case'tstart':try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume&&audioCtx.resume()}catch(e){}
      goalChimed=ringFrac()>=1;T0.state='running';T0.startedAt=Date.now();T0.accMs=0;T0.date=today();await save();lockScreen(true);renderTimer();startTick();return true;
    case'tpause':T0.accMs=elapsedMs();T0.state='paused';await save();lockScreen(false);renderTimer();return true;
    case'tresume':T0.state='running';T0.startedAt=Date.now();await save();lockScreen(true);renderTimer();return true;
    case'tfinish':if(T0.state==='running'){T0.accMs=elapsedMs();T0.state='paused';await save();lockScreen(false)}tView='finish';renderTimer();return true;
    case'tback':tView='run';T0.state='running';T0.startedAt=Date.now();await save();lockScreen(true);renderTimer();return true;
    case'tdiscard':if(!t.dataset.armed){t.dataset.armed=1;t.textContent='Tap again to discard';return true}
      S.timer={state:'idle',bookId:T0.bookId,startedAt:0,accMs:0};await save();tView='run';renderTimer();toast('Session discarded');return true;
    case'tsave':{
      const min=Math.max(1,Math.round(elapsedMs()/60000)),d=T0.date||today(),bk=T0.bookId?find(T0.bookId):null;
      if(bk){const pv=parseInt(($('#tPage')||{}).value,10);const pg=isNaN(pv)?(bk.page||0):pv;bk.sessions.push({id:uid(),date:d,page:pg,min});bk.page=pg;
        if(bk.status==='want'){bk.status='reading';bk.start=bk.start||d}
        if(bk.pages&&pg>=bk.pages&&bk.status!=='done'){bk.status='done';bk.finish=d}}
      else{S.checkins[d]=(+S.checkins[d]||0)+min}
      S.timer={state:'idle',bookId:T0.bookId,startedAt:0,accMs:0};await save();
      tView='run';closeTimer();toast(`Saved ${min} minute${min===1?'':'s'} of reading`);checkLevelUp();return true}
  }
  return false;
}

/* ---------- updates ---------- */
let swReg=null,updating=false;
function showUpdate(){$('#update').classList.add('on')}
function applyUpdate(){
  $('#update').classList.remove('on');
  if(swReg&&swReg.waiting){updating=true;swReg.waiting.postMessage({type:'SKIP_WAITING'});setTimeout(()=>location.reload(),3000)}
  else location.reload();
}
async function setupSW(){
  if(!('serviceWorker' in navigator)||framed||!(location.protocol==='https:'||location.hostname==='localhost'))return;
  try{swReg=await navigator.serviceWorker.register('sw.js')}catch(e){return}
  const watch=w=>{if(!w)return;w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)showUpdate()})};
  if(swReg.waiting&&navigator.serviceWorker.controller)showUpdate();
  watch(swReg.installing);
  swReg.addEventListener('updatefound',()=>watch(swReg.installing));
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(updating)location.reload()});
  const check=()=>{if(navigator.onLine)swReg.update().catch(()=>{})};
  setInterval(check,30*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)check()});
  window.addEventListener('online',check);
}
function showWhatsNew(justUpdated){
  openSheet(`<div class="sheet-h"><h2>${justUpdated?'Updated to '+APP_VERSION:'What’s new'}</h2><button class="x" data-act="close" aria-label="Close">✕</button></div>
  <div class="stack">${CHANGELOG.map((c,i)=>`<div><div class="eyebrow">Version ${c.v}${i===0?' · current':''}</div><ul class="whatsnew" style="margin:6px 0 0;padding-left:20px">${c.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}
  <button class="btn wide" data-act="close">Lovely</button></div>`,'whatsnew');
}

/* ---------- boot ---------- */
(async()=>{
  await load();applyStyle();applyTheme(true);render();
  if(darkMQ&&darkMQ.addEventListener)darkMQ.addEventListener('change',()=>{applyTheme();if(!sheetFor)render()});
  setInterval(()=>{const k=curTheme;applyTheme();if(k!==curTheme&&!sheetFor)render();else refreshIfStale()},60*1000);
  setupSW();
  checkLevelUp();updatePill();if(T().state==='running')startTick();
  try{const seen=localStorage.getItem('pp-version');if(seen&&seen!==APP_VERSION)setTimeout(()=>showWhatsNew(true),600);localStorage.setItem('pp-version',APP_VERSION)}catch(e){}
  if(!framed&&navigator.onLine&&!readerReady()){setTimeout(()=>{prepareReader().then(w=>{w.terminate();ocrWorker=null;if(view==='settings')render()}).catch(()=>{})},5000)}
})();
})();
</script>
